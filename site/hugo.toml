baseURL = "https://hjalves.github.io/padshell/"
title = "padshell devlog"
locale = "en"
disableKinds = ["taxonomy", "term"]

[params]
  description = "Development log of padshell, a gamepad-driven homebrew shell for the Nintendo Switch."
  repo = "https://github.com/hjalves/padshell"
  # Address of the Gemini capsule once it is hosted, e.g. "gemini://example.org/".
  # Leave empty to hide the links to it.
  capsule = ""

# Gemtext output for the Gemini capsule, written to public/gemini/.
# Upload that folder as the capsule root; links in it are capsule-absolute.
[mediaTypes."text/gemini"]
  suffixes = ["gmi"]

[outputFormats.gemini]
  mediaType = "text/gemini"
  isPlainText = true
  protocol = "gemini://"
  path = "gemini"

[outputs]
  home = ["html", "rss", "gemini"]
  section = ["html", "rss", "gemini"]
  page = ["html", "gemini"]

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
