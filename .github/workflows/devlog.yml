# Build the devlog (site/) with Hugo and publish it to GitHub Pages: the HTML,
# plus the Gemini capsule packed as capsule.tar.gz. The Gemini server pulls
# that file (padshell-capsule-sync on atom), so it needs no credentials here.
name: devlog

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/devlog.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -sSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Pack the Gemini capsule
        run: |
          mv site/public/gemini capsule
          tar -C capsule --owner=0 --group=0 --numeric-owner -czf site/public/capsule.tar.gz .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
